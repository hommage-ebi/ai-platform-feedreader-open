<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="description" content="研究論文を日本語の要約と図から読む、自分だけのフィード。"><title>ai-platform-feedreader</title></head>
<body>
<a class="skip" href="#list">記事一覧へ</a>
<div class="workspace">
<aside id="sidebar" aria-label="フィード">
 <header class="brand-header"><a class="brand" href="/">ai-platform-<wbr>feedreader</a><button id="close-feeds" class="icon-button close-feeds mobile-only" aria-label="記事一覧に戻る">×</button></header>
 <div class="sidebar-scroll"><nav id="feeds" class="feed-nav" aria-label="フィードの選択"></nav><div class="keyboard-help"><p>キーボードで読む</p><span><kbd>j</kbd> 次の記事</span><span><kbd>k</kbd> 前の記事</span><span><kbd>b</kbd> 原文を別タブで開く</span><span><kbd>⇧ j</kbd> 次のフィード</span><span><kbd>⇧ k</kbd> 前のフィード</span></div><p class="gesture-hint mobile-only">行を右にスワイプして<br>既読・未読を切り替え</p></div>
 <p id="updated" class="feed-updated">最終更新 —</p>
</aside>
<main id="list-pane" aria-label="記事一覧">
 <div class="list-tools"><div class="search-row"><button id="menu" class="icon-button mobile-only" aria-label="サイドバーを開く" aria-expanded="false">☰</button><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="タイトル・日本語要約で検索" aria-label="記事を検索"></label></div><div class="filter-row"><span id="unread-count">未読 —</span><label class="sr-only" for="read-filter">表示する記事</label><select id="read-filter"><option value="unread">未読のみ</option><option value="all">すべての記事</option></select><label class="sr-only" for="sort">並び順</label><select id="sort"><option value="date">新しい順</option><option value="title">タイトル順</option></select></div><div class="history-row"><label for="batch-date">告知日</label><select id="batch-date"><option value="all">すべての日付</option></select><button id="reset" class="quiet-button">リセット</button></div></div>
 <div id="list" role="list" tabindex="-1"><p class="empty">記事を読み込んでいます</p></div>
 <footer class="list-footer"><span id="count" aria-live="polite"></span><button id="bulk" class="quiet-button">すべて既読</button></footer>
</main>
<section id="article-pane" aria-label="選択した記事">
 <div class="article-toolbar mobile-only"><button id="back" class="back-button">‹ 一覧</button><span id="article-position"></span><div class="article-nav"><button id="previous" class="icon-button" aria-label="前の記事">‹</button><button id="next" class="icon-button" aria-label="次の記事">›</button></div></div>
 <div id="article-scroll"><article id="article"><div class="welcome"><span aria-hidden="true">▤</span><h2>読む記事を選んでください</h2><small><kbd>j</kbd> 次へ <kbd>k</kbd> 前へ</small></div></article><details id="version-history" hidden><summary>版の履歴</summary><label id="version-label">表示する版 <select id="version"></select></label><div id="version-notes"></div></details></div>
 <footer id="article-actions" class="mobile-only" hidden><button id="read-state" class="icon-button" aria-label="未読に戻す"><span class="read-dot"></span></button><button id="star-state" class="icon-button" aria-label="スターを付ける">☆</button><button id="bad-state" class="icon-button" aria-label="関心に合わない"></button><a id="original" class="original-link" target="_blank" rel="noopener noreferrer" aria-label="原文を別タブで開く" hidden>↗</a></footer>
</section></div>
<div id="notices" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script></body></html>
